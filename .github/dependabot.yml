version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      dev-dependencies: { dependency-type: development }
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      react: { patterns: ['react', 'react-dom', '@types/react*'] }
      dev-dependencies: { dependency-type: development }
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: 'chore(ci)' }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
